name: Update Now data

on:
  schedule:
    - cron: "17 */6 * * *"     # every 6 hours
  workflow_dispatch:           # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build now.json
        run: python3 now_sync.py
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "now-bot"
          git config user.email "now-bot@users.noreply.github.com"
          git add now.json
          git diff --cached --quiet || (git commit -m "Update now.json" && git push)
